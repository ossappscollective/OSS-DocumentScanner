<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardwallet card view: iOS states</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
:root{--text-primary:#1f1f1e;--text-secondary:#5f5e5a;--border-strong:#c8c6bd;--surface-1:#e9e8e1;--page:#fafaf7}
@media(prefers-color-scheme:dark){:root{--text-primary:#f1f0ea;--text-secondary:#b0aea5;--border-strong:#4a4944;--surface-1:#34332f;--page:#1c1c1a}}
body{font-family:system-ui,sans-serif;margin:24px;background:var(--page);color:var(--text-primary);max-width:720px}
button{font:inherit;font-size:13px;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:8px;padding:5px 12px;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<h2 class="sr-only">Eight iOS states of the Cardwallet card view with stacked code and photo zones: photo swipe, sheet at medium and large, more menu, edit, pages list, fullscreen code and Reduce Transparency.</h2>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 14px">
<span style="font-size:13px;color:var(--text-secondary)">Card color</span>
<div id="sw" style="display:flex;gap:8px"></div>
<span style="width:1px;height:20px;background:var(--border-strong)"></span>
<button id="bl">Light</button><button id="bd">Dark</button>
</div>
<div id="out"></div>
<script>
const colors=['#3f7a73','#8a3b4d','#44556f','#b08a2e','#6a4c93'];
const state={hex:colors[0],dark:false};
const hsl=(h,s,l)=>`hsl(${Math.round(((h%360)+360)%360)} ${Math.round(s)}% ${Math.round(l)}%)`;
function toH(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,s*100,l*100]}
const photoCol=i=>{const h=toH(state.hex)[0];return hsl(h+50+i*45,40,state.dark?32:72)};
function roles(){const[h,s0]=toH(state.hex),s=Math.min(Math.max(s0,35),70),d=state.dark,l=d?66:42;return{acc:hsl(h,s,l),onAcc:l>=60?'#000':'#fff',page:d?'#000':'#f2f2f7',row:d?'#1c1c1e':'#fff',txt:d?'#fff':'#000',sub:d?'rgba(235,235,245,.65)':'rgba(60,60,67,.65)',glass:d?'rgba(70,70,76,.42)':'rgba(255,255,255,.42)',gb:d?'rgba(255,255,255,.22)':'rgba(255,255,255,.8)',sep:d?'rgba(84,84,88,.6)':'rgba(60,60,67,.18)',sheet:d?'rgba(40,40,44,.72)':'rgba(248,248,252,.74)'}}
const BF='backdrop-filter:blur(18px) saturate(1.7);-webkit-backdrop-filter:blur(18px) saturate(1.7);';
const gl=(r,solid)=>solid?`background:${state.dark?'#2c2c2e':'#ffffff'};border:1px solid ${r.sep};`:`background:${r.glass};border:1px solid ${r.gb};${BF}`;
const ic=(n,sz,c)=>`<i class="ti ti-${n}" style="font-size:${sz||20}px;${c?'color:'+c:''}"></i>`;
function lcg(seed){let v=seed;return()=>{v=(v*1103515245+12345)%2147483648;return v/2147483648}}
function qr(sz,seed){const n=21,c=sz/n,rnd=lcg(seed);let s='';
for(let y=0;y<n;y++)for(let x=0;x<n;x++){const f=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);if(!f&&rnd()>.52)s+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#000"/>`}
const fin=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#000"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#000"/>`;
return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${s}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg>`}
function bars(w,h,seed){const rnd=lcg(seed);let x=0,s='';while(x<w){const bw=1+Math.floor(rnd()*3);if(rnd()>.4)s+=`<rect x="${x}" y="0" width="${bw}" height="${h}" fill="#000"/>`;x+=bw+1}return`<svg width="${w}" height="${h}">${s}</svg>`}
const D={name:'Decathlon',sub:'Loyalty card',rows:[['Member','Martin G.'],['Expires','12/2027'],['Store','Paris 11']]};
const PW=240,PG=8,S=638;
function qrTile(){return`<div style="width:${PW}px;height:140px;box-sizing:border-box;border-radius:28px;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;gap:16px;color:#000"><div style="display:flex;align-items:center;gap:16px">${qr(100,7)}<div><div style="font-size:11px;color:#6b6b70">QR code</div><div style="font-size:16px;font-weight:500;letter-spacing:.5px;margin-top:4px;line-height:1.3">4821<br>7730</div></div></div></div>`}
function barTile(){return`<div style="width:${PW}px;height:110px;box-sizing:border-box;border-radius:28px;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#000">${bars(196,40,3)}<div style="font-size:14px;font-weight:500;letter-spacing:.5px">5901234 123457</div></div>`}
function stack(r,top,psel,solid){let out='';const place=(items,sel,y,H)=>items.forEach((it,i)=>{const x=16+(i-sel)*(PW+PG);if(x>300||x<-PW+8)return;out+=`<div style="position:absolute;left:${x}px;top:${y+(H-it.h)/2}px">${it.html}</div>`});
place([{h:140,html:qrTile()},{h:110,html:barTile()}],0,top,140);
out+=`<div style="position:absolute;left:0;right:0;top:${top+148}px;display:flex;justify-content:center"><div style="display:inline-flex;gap:5px;align-items:center;padding:6px 9px;border-radius:12px;${gl(r,solid)}"><span style="height:6px;width:16px;border-radius:3px;background:${r.acc}"></span><span style="height:6px;width:6px;border-radius:3px;background:${r.sub};opacity:.5"></span></div></div>`;
const py=top+174,photos=[0,1].map(i=>({h:152,html:`<div style="width:${PW}px;height:152px;border-radius:28px;background:${photoCol(i)};display:flex;align-items:center;justify-content:center;color:${r.sub}">${ic('photo',18)}</div>`}));place(photos,psel,py,152);
out+=`<div style="position:absolute;left:0;right:0;top:${py+162}px;display:flex;justify-content:center"><div style="display:inline-flex;gap:8px;padding:5px;border-radius:16px;${gl(r,solid)}">${[0,1].map(i=>`<div style="width:44px;height:30px;border-radius:8px;background:${photoCol(i)};${i===psel?`outline:2px solid ${r.acc};outline-offset:1px`:''}"></div>`).join('')}</div></div>`;
return{html:out,bottom:py+162+40}}
const frame=(inner,r,bg)=>`<div style="width:300px;height:650px;border-radius:46px;background:${bg||r.page};border:6px solid #17171a;box-sizing:border-box;position:relative;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;color:${r.txt}"><div style="position:absolute;top:8px;left:50%;margin-left:-42px;width:84px;height:24px;border-radius:12px;background:#000;z-index:20"></div>${inner}</div>`;
const gbtn=(r,n,solid)=>`<div style="width:40px;height:40px;border-radius:50%;${gl(r,solid)}display:flex;align-items:center;justify-content:center;color:${r.txt}">${ic(n,20)}</div>`;
const navBtns=(r,solid,title)=>`<div style="position:absolute;left:14px;top:44px;z-index:3">${gbtn(r,'chevron-left',solid)}</div><div style="position:absolute;right:14px;top:44px;z-index:3">${gbtn(r,'dots',solid)}</div>${title?`<div style="position:absolute;left:0;right:0;top:54px;text-align:center;font-size:15px;font-weight:600">${title}</div>`:''}`;
const nameBlock=(r,size,top)=>`<div style="position:absolute;left:20px;right:20px;top:${top}px"><div style="font-size:${size}px;font-weight:700;line-height:1.1">${D.name}</div><div style="display:inline-block;margin-top:6px;padding:3px 10px;border-radius:12px;background:color-mix(in srgb,${r.acc} 32%,transparent);border:1px solid ${r.gb};font-size:12px">${D.sub}</div></div>`;
const toolbar=(r,solid)=>`<div style="position:absolute;left:14px;right:14px;bottom:16px;height:52px;border-radius:26px;${gl(r,solid)}display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 16px;z-index:4"><div style="display:flex;gap:18px;color:${r.txt}">${ic('share',21)}${ic('star',21)}</div><div style="display:flex;align-items:center;gap:14px;color:${r.txt}"><div style="width:76px;height:40px;border-radius:20px;background:${r.acc};color:${r.onAcc};display:flex;align-items:center;justify-content:center">${ic('pencil',20)}</div>${ic('dots',21)}<span style="width:2px"></span></div></div>`;
const ambient=(r,psel)=>{const dk=state.dark;return`<div style="position:absolute;left:-60px;top:40px;width:280px;height:280px;border-radius:50%;background:${photoCol(psel)};opacity:${dk?.5:.6};filter:blur(44px)"></div><div style="position:absolute;right:-90px;top:360px;width:240px;height:240px;border-radius:50%;background:${r.acc};opacity:${dk?.4:.45};filter:blur(44px)"></div>`};
const rowsHtml=(r,rows,fs)=>rows.map((x,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;height:38px;margin:0 20px;border-top:${i?'0.5px solid '+r.sep:'none'};font-size:${fs||14}px"><span style="color:${r.sub}">${x[0]}</span><span>${x[1]}</span></div>`).join('');
function main(r,o){const psel=o.psel==null?0:o.psel,med=o.med,s=o.solid,top=med?138:160,sc=med?.78:1;const st=stack(r,top,psel,s);
const zones=`<div style="position:absolute;left:0;top:0;width:300px;height:650px;transform:scale(${sc});transform-origin:50% ${top}px">${st.html}</div>`;const bottom=top+(st.bottom-top)*sc,sTop=bottom+14;
const sheet=`<div style="position:absolute;left:0;right:0;top:${sTop}px;bottom:0;border-radius:28px 28px 0 0;${gl(r,s)}z-index:2"><div style="width:36px;height:5px;border-radius:3px;background:${r.sep};margin:8px auto 6px"></div>${med?rowsHtml(r,D.rows.concat([['+ Add field','']])):''}</div>`;
let menu='';if(o.menu){menu=`<div style="position:absolute;inset:0;background:rgba(0,0,0,${state.dark?.35:.16});z-index:5"></div><div style="position:absolute;right:14px;bottom:80px;width:200px;border-radius:22px;background:${state.dark?'rgba(60,60,66,.78)':'rgba(255,255,255,.78)'};border:1px solid ${r.gb};${BF}z-index:6;padding:6px 0;font-size:15px">${[['arrows-maximize','Fullscreen'],['share','Share'],['pencil','Rename']].map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 16px">${x[1]}${ic(x[0],18)}</div>`).join('')}<div style="height:0.5px;background:${r.sep};margin:4px 0"></div><div style="display:flex;justify-content:space-between;align-items:center;padding:11px 16px;color:#ff453a">Delete card${ic('trash',18)}</div></div>`}
return frame((s?'':ambient(r,psel))+navBtns(r,s)+nameBlock(r,med?26:32,med?84:92)+zones+sheet+toolbar(r,s)+menu,r)}
function large(r){return frame(navBtns(r,false,D.name)+`<div style="position:absolute;left:0;right:0;top:100px;bottom:0;border-radius:28px 28px 0 0;background:${r.row};box-shadow:0 -1px 0 ${r.sep}"><div style="width:36px;height:5px;border-radius:3px;background:${r.sep};margin:8px auto 10px"></div><div style="font-size:12px;color:${r.sub};margin:0 20px 6px;text-transform:uppercase">Details</div>${rowsHtml(r,D.rows.concat([['Notes','Ask desk'],['PIN','••••']]),15)}<div style="height:38px;margin:0 20px;border-top:0.5px solid ${r.sep};display:flex;align-items:center;color:${r.acc};font-size:15px;gap:6px">${ic('plus',18)} Add field</div></div>`+toolbar(r,false),r)}
const sheetHead=(r,title,left,right)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 14px 10px"><div style="padding:8px 14px;border-radius:18px;${gl(r)}font-size:14px">${left}</div><div style="font-size:15px;font-weight:600">${title}</div><div style="padding:8px 16px;border-radius:18px;background:${r.acc};color:${r.onAcc};font-size:14px;font-weight:500">${right}</div></div>`;
const sheetBox=(r,top,inner)=>`<div style="position:absolute;left:0;right:0;top:${top}px;bottom:0;border-radius:28px 28px 0 0;background:${r.sheet};border-top:1px solid ${r.gb};${BF}z-index:6">${inner}</div>`;
function edit(r){const field=(a,b,first)=>`<div style="display:flex;justify-content:space-between;align-items:center;height:42px;margin:0 16px;border-top:${first?'none':'0.5px solid '+r.sep};font-size:14px"><span style="color:${r.sub}">${a}</span><span>${b}</span></div>`;const cols=['#3f7a73','#8a3b4d','#44556f','#b08a2e','#6a4c93'];
return frame(ambient(r,0)+navBtns(r)+nameBlock(r,32,92)+sheetBox(r,150,sheetHead(r,'Edit card','Cancel','Save')+`<div style="margin:6px 14px;border-radius:20px;background:${r.row};overflow:hidden">${field('Name','Decathlon',1)}${field('Type','Loyalty card')}<div style="display:flex;justify-content:space-between;align-items:center;height:46px;margin:0 16px;border-top:0.5px solid ${r.sep};font-size:14px"><span style="color:${r.sub}">Color</span><span style="display:flex;gap:8px">${cols.map((c,i)=>`<span style="width:22px;height:22px;border-radius:50%;background:${c};${i===0?`outline:2px solid ${r.txt};outline-offset:2px`:''}"></span>`).join('')}</span></div></div><div style="margin:12px 14px;border-radius:20px;background:${r.row};overflow:hidden">${field('Member','Martin G.',1)}${field('Expires','12/2027')}<div style="height:42px;margin:0 16px;border-top:0.5px solid ${r.sep};display:flex;align-items:center;color:${r.acc};font-size:14px;gap:6px">${ic('plus',16)} Add field</div></div><div style="margin:12px 14px;border-radius:20px;background:${r.row};height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:14px"><span>Codes and photos</span><span style="color:${r.sub}">2 codes, 2 photos ${ic('chevron-right',16)}</span></div>`),r)}
function pages(r){const code=(ico,t,nm,i)=>`<div style="display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-top:${i?'0.5px solid '+r.sep:'none'}"><div style="width:34px;height:34px;border-radius:9px;background:#fff;border:0.5px solid ${r.sep};display:flex;align-items:center;justify-content:center;color:#000">${ic(ico,18)}</div><div style="flex:1"><div style="font-size:14px">${nm||'Add name'}</div><div style="font-size:12px;color:${r.sub}">${t}</div></div>${ic('grip-vertical',20,r.sub)}</div>`;
const photo=(i)=>`<div style="display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;border-top:${i?'0.5px solid '+r.sep:'none'}"><div style="width:44px;height:30px;border-radius:8px;background:${photoCol(i)}"></div><div style="flex:1;font-size:14px">Photo ${i+1}</div>${ic('grip-vertical',20,r.sub)}</div>`;const hd=t=>`<div style="font-size:12px;color:${r.sub};margin:10px 28px 4px;text-transform:uppercase">${t}</div>`;
return frame(ambient(r,0)+navBtns(r)+nameBlock(r,32,92)+sheetBox(r,130,sheetHead(r,'Codes and photos','Cancel','Done')+hd('Codes')+`<div style="margin:0 14px;border-radius:20px;background:${r.row};overflow:hidden">${code('qrcode','QR code · 4821 7730','',0)}${code('barcode','Code 128 · 5901234 123457','Gift card',1)}</div>`+hd('Photos')+`<div style="margin:0 14px;border-radius:20px;background:${r.row};overflow:hidden">${photo(0)}${photo(1)}</div><div style="margin:12px 14px;border-radius:20px;background:${r.row};overflow:hidden;font-size:14px;color:${r.acc}"><div style="display:flex;align-items:center;gap:8px;height:44px;padding:0 16px">${ic('qrcode',18)} Scan or add code</div><div style="display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-top:0.5px solid ${r.sep}">${ic('camera',18)} Add photo</div></div>`),r)}
function full(r){const gb='rgba(0,0,0,.08)';return frame(`<div style="position:absolute;left:14px;top:44px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.07);border:1px solid ${gb};display:flex;align-items:center;justify-content:center;color:#000">${ic('x',20)}</div><div style="position:absolute;right:14px;top:50px;padding:6px 12px;border-radius:16px;background:rgba(0,0,0,.07);border:1px solid ${gb};font-size:12px;color:#000;display:flex;gap:6px;align-items:center">${ic('sun',15)} Max brightness</div><div style="position:absolute;left:0;right:0;top:150px;display:flex;flex-direction:column;align-items:center;gap:14px;color:#000">${qr(236,7)}<div style="font-size:22px;font-weight:500;letter-spacing:1px">4821 7730</div></div><div style="position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:center"><div style="display:inline-flex;gap:5px;align-items:center;padding:6px 9px;border-radius:12px;background:rgba(0,0,0,.07);border:1px solid ${gb}"><span style="height:6px;width:16px;border-radius:3px;background:${r.acc}"></span><span style="height:6px;width:6px;border-radius:3px;background:rgba(0,0,0,.35)"></span></div></div>`,r,'#fff')}
const LAB=['Swipe photos: backdrop follows','Sheet medium: zones scale','Sheet large: opaque','More menu from glass','Edit card','Codes and photos list','Fullscreen code','Reduce Transparency'];
const scaled=(html,label)=>`<div style="width:160px"><div style="width:160px;height:347px"><div style="width:300px;height:650px;transform:scale(.5333);transform-origin:0 0">${html}</div></div><div style="font-size:12px;color:var(--text-secondary);text-align:center;margin-top:6px">${label}</div></div>`;
function render(){const r=roles();const screens=[main(r,{psel:1}),main(r,{med:true}),large(r),main(r,{menu:true}),edit(r),pages(r),full(r),main(r,{solid:true})];
let h='';for(let i=0;i<8;i+=4)h+=`<div style="display:flex;gap:12px;margin-bottom:18px">${screens.slice(i,i+4).map((s,j)=>scaled(s,LAB[i+j])).join('')}</div>`;
document.getElementById('out').innerHTML=h;
document.querySelectorAll('#sw button').forEach(x=>x.style.outline=x.dataset.c===state.hex?'2px solid var(--text-primary)':'none');
document.getElementById('bl').style.background=state.dark?'transparent':'var(--surface-1)';
document.getElementById('bd').style.background=state.dark?'var(--surface-1)':'transparent'}
document.getElementById('sw').innerHTML=colors.map(c=>`<button data-c="${c}" aria-label="Card color ${c}" style="width:26px;height:26px;padding:0;border-radius:50%;background:${c};border:none;outline-offset:2px"></button>`).join('');
document.querySelectorAll('#sw button').forEach(x=>x.onclick=()=>{state.hex=x.dataset.c;render()});
document.getElementById('bl').onclick=()=>{state.dark=false;render()};
document.getElementById('bd').onclick=()=>{state.dark=true;render()};
render();
</script>
</body>
</html>
