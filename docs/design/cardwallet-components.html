<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardwallet components: buttons, text fields, chips, selection, sheets</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
:root{--text-primary:#1f1f1e;--text-secondary:#5f5e5a;--border-strong:#c8c6bd;--surface-1:#e9e8e1;--page:#fafaf7}
@media(prefers-color-scheme:dark){:root{--text-primary:#f1f0ea;--text-secondary:#b0aea5;--border-strong:#4a4944;--surface-1:#34332f;--page:#1c1c1a}}
body{font-family:system-ui,sans-serif;margin:24px;background:var(--page);color:var(--text-primary);max-width:720px}
button{font:inherit;font-size:13px;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:8px;padding:5px 12px;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<h2 class="sr-only">Cardwallet component basics on iOS and Android: buttons, text fields, chips, selection controls and sheets, shown on a page, an opaque sheet and a transparent sheet over a camera scene.</h2>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 14px">
<button id="bl">Light</button><button id="bd">Dark</button>
<span style="width:1px;height:20px;background:var(--border-strong)"></span>
<button id="pi">iOS</button><button id="pa">Android</button>
<span style="width:1px;height:20px;background:var(--border-strong)"></span>
<span style="font-size:13px;color:var(--text-secondary)">Scene behind transparent sheet</span>
<button id="sd">Dark</button><button id="sb">Bright</button>
</div>
<div id="out" style="display:flex;gap:12px;align-items:flex-start"></div>
<script>
const S={dark:false,plat:'ios',scene:'dark'};
const BF='backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);';
const ic=(n,sz,c)=>`<i class="ti ti-${n}" style="font-size:${sz||18}px;${c?'color:'+c:''}"></i>`;
function K(kind){const d=S.dark,i=S.plat==='ios';
if(kind==='glass')return{txt:'#fff',sub:'rgba(255,255,255,.68)',fill:'rgba(255,255,255,.14)',sep:'rgba(255,255,255,.22)',line:'rgba(255,255,255,.55)',acc:i?'#7db4ff':'#a8c7fa',onAcc:'#04132e',tonal:'rgba(255,255,255,.18)',onTonal:'#fff',danger:'#ff8f87',dangerFill:'rgba(255,105,97,.22)',seg:'rgba(255,255,255,.26)',off:'rgba(255,255,255,.3)'};
if(i)return{txt:d?'#fff':'#000',sub:d?'rgba(235,235,245,.65)':'rgba(60,60,67,.65)',fill:kind==='sheet'?(d?'#2c2c2e':'#f2f2f7'):(d?'#1c1c1e':'#fff'),sep:d?'rgba(84,84,88,.6)':'rgba(60,60,67,.2)',line:'',acc:d?'#6fb3ff':'#0a60ff',onAcc:d?'#000':'#fff',tonal:d?'rgba(111,179,255,.2)':'rgba(10,96,255,.12)',onTonal:d?'#6fb3ff':'#0a60ff',danger:d?'#ff6961':'#d70015',dangerFill:d?'rgba(255,105,97,.2)':'rgba(215,0,21,.1)',seg:d?'#636366':'#fff',off:d?'rgba(120,120,128,.5)':'rgba(120,120,128,.3)'};
return{txt:d?'#e3e3e3':'#1f1f1f',sub:d?'#c4c7c5':'#5f6368',fill:d?'#2b2c2e':'#e9eef6',sep:d?'#444746':'#c4c7c5',line:d?'#8e918f':'#747775',acc:d?'#a8c7fa':'#0b57d0',onAcc:d?'#062e6f':'#fff',tonal:d?'#1d3a6a':'#d3e3fd',onTonal:d?'#d3e3fd':'#041e49',danger:d?'#f2b8b5':'#b3261e',dangerFill:d?'#601410':'#f9dedc',seg:d?'#1d3a6a':'#d3e3fd',off:d?'#8e918f':'#747775'}}
const sec=(k,t)=>`<div style="font-size:11px;letter-spacing:.5px;color:${k.sub};margin:14px 0 6px;text-transform:uppercase">${t}</div>`;
function btn(k,label,kind,icon){const i=S.plat==='ios',h=i?44:40,r=h/2;const m={primary:[k.acc,k.onAcc],tonal:[k.tonal,k.onTonal],text:['transparent',k.acc],danger:[k.dangerFill,k.danger]}[kind];return`<div style="flex:1;height:${h}px;border-radius:${r}px;background:${m[0]};color:${m[1]};display:flex;align-items:center;justify-content:center;gap:6px;font-size:${i?15:14}px;font-weight:${i?600:500};white-space:nowrap">${icon?ic(icon,17):''}${label}</div>`}
function iconBtn(k,icon,kind){const i=S.plat==='ios',sz=i?44:40;const m={tonal:[k.tonal,k.onTonal],primary:[k.acc,k.onAcc],plain:['transparent',k.txt]}[kind];return`<div style="width:${sz}px;height:${sz}px;border-radius:${sz/2}px;background:${m[0]};color:${m[1]};display:flex;align-items:center;justify-content:center;${kind==='plain'?`border:1px solid ${k.sep}`:''}">${ic(icon,20)}</div>`}
function field(k,label,value,st){const i=S.plat==='ios';const col=st==='error'?k.danger:st==='focus'?k.acc:k.sub;const caret=st==='focus'?`<span style="display:inline-block;width:1.5px;height:16px;background:${k.acc};vertical-align:-3px;margin-left:1px"></span>`:'';const tr=st==='select'?ic('chevron-down',18,k.sub):st==='focus'?ic('circle-x',17,k.sub):st==='error'?ic('alert-circle',17,k.danger):'';
if(i){const ring=st==='focus'||st==='error'?`box-shadow:inset 0 0 0 1.5px ${col};`:'';return`<div style="margin-bottom:8px"><div style="font-size:11px;color:${col};margin:0 0 2px 16px;height:14px">${st==='empty'?'&nbsp;':label}</div><div style="height:48px;box-sizing:border-box;border-radius:24px;background:${k.fill};${ring}padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-size:15px;color:${k.txt}"><span>${value||`<span style="color:${k.sub};opacity:.6">${label}</span>`}${caret}</span>${tr}</div>${st==='error'?`<div style="font-size:11px;color:${k.danger};margin:3px 16px 0">Required</div>`:''}</div>`}
const edge=st==='focus'||st==='error'?col:k.line,w=st==='focus'||st==='error'?2:1.5;return`<div style="margin-bottom:6px"><div style="height:56px;box-sizing:border-box;border-radius:20px 20px 20px 6px;border:${w}px solid ${edge};padding:0 14px;display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:11px;color:${col}">${label}</div><div style="font-size:14px;color:${k.txt};margin-top:1px">${value}${caret}</div></div>${tr}</div>${st==='error'?`<div style="font-size:11px;color:${k.danger};margin:3px 14px 0">Required</div>`:''}</div>`}
function chip(k,label,kind){const i=S.plat==='ios',h=32,r=i?16:8;const sel=kind==='sel';const bg=sel?(i?k.acc:k.tonal):(i?k.fill:'transparent');const col=sel?(i?k.onAcc:k.onTonal):k.txt;const bd=!i&&!sel?`border:1px solid ${k.sep};`:'';return`<div style="height:${h}px;box-sizing:border-box;border-radius:${r}px;background:${bg};color:${col};${bd}display:inline-flex;align-items:center;gap:4px;padding:0 ${kind==='input'?8:12}px;font-size:13px;font-weight:500">${sel?ic('check',14):''}${kind==='assist'?ic('plus',14):''}${label}${kind==='input'?ic('x',14,k.sub):''}</div>`}
function sw(k,on){const i=S.plat==='ios',w=i?51:52,h=i?31:32;const th=i?27:(on?24:16);return`<div style="width:${w}px;height:${h}px;border-radius:${h/2}px;background:${on?k.acc:(i?k.off:'transparent')};${!i&&!on?`border:2px solid ${k.off};box-sizing:border-box;`:''}position:relative"><div style="position:absolute;top:50%;margin-top:-${th/2}px;${on?`right:${i?2:4}px`:`left:${i?2:6}px`};width:${th}px;height:${th}px;border-radius:50%;background:${i?'#fff':(on?k.onAcc:k.off)}"></div></div>`}
function check(k,on){const i=S.plat==='ios';if(i)return`<div style="width:24px;height:24px;border-radius:12px;box-sizing:border-box;${on?`background:${k.acc};color:${k.onAcc}`:`border:1.5px solid ${k.off}`};display:flex;align-items:center;justify-content:center">${on?ic('check',15):''}</div>`;return`<div style="width:20px;height:20px;border-radius:4px;box-sizing:border-box;${on?`background:${k.acc};color:${k.onAcc}`:`border:2px solid ${k.off}`};display:flex;align-items:center;justify-content:center">${on?ic('check',15):''}</div>`}
function radio(k,on){return`<div style="width:22px;height:22px;border-radius:11px;box-sizing:border-box;border:${on?2:1.5}px solid ${on?k.acc:k.off};display:flex;align-items:center;justify-content:center">${on?`<div style="width:10px;height:10px;border-radius:5px;background:${k.acc}"></div>`:''}</div>`}
const row=(k,label,ctl)=>`<div style="display:flex;align-items:center;justify-content:space-between;height:42px;font-size:15px;border-bottom:0.5px solid ${k.sep}"><span>${label}</span>${ctl}</div>`;
function seg(k,items){const i=S.plat==='ios';if(i)return`<div style="display:flex;padding:2px;border-radius:16px;background:${k.fill};height:32px;box-sizing:border-box">${items.map((t,n)=>`<div style="flex:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:${n?400:600};${n?'':`background:${k.seg}`}">${t}</div>`).join('')}</div>`;
return`<div style="display:flex;gap:2px">${items.map((t,n)=>{const e=items.length-1,rad=n===0?'20px 6px 6px 20px':n===e?'6px 20px 20px 6px':'6px';return`<div style="flex:1;height:40px;border-radius:${rad};display:flex;align-items:center;justify-content:center;gap:3px;font-size:12px;${n?`border:1px solid ${k.sep};box-sizing:border-box`:`background:${k.seg};color:${k.onTonal}`}">${n?'':ic('check',13)}${t}</div>`}).join('')}</div>`}
function mini(k,sel){return`<div style="position:relative;width:78px;height:50px;border-radius:14px;background:${k.sub};opacity:${sel?1:.55};${sel?'transform:scale(.95)':''}">${sel?`<div style="position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:10px;background:${k.acc};color:${k.onAcc};border:2px solid ${k.fill};display:flex;align-items:center;justify-content:center;box-sizing:content-box;margin:-2px 0 0 -2px">${ic('check',12)}</div>`:''}</div>`}
function kit(k){return`${sec(k,'Buttons')}<div style="display:flex;gap:8px;margin-bottom:8px">${btn(k,'Save','primary')}${btn(k,'Edit','tonal')}</div><div style="display:flex;gap:8px;margin-bottom:8px">${btn(k,'Cancel','text')}${btn(k,'Delete','danger')}</div><div style="display:flex;gap:10px;margin-bottom:2px">${iconBtn(k,'share','tonal')}${iconBtn(k,'star','plain')}${iconBtn(k,'pencil','primary')}</div>${sec(k,'Text fields')}${field(k,'Resolution','Full HD','select')}${field(k,'Name','Decathlon','focus')}${field(k,'Code','','error')}${sec(k,'Chips')}<div style="display:flex;flex-wrap:wrap;gap:6px">${chip(k,'Auto','sel')}${chip(k,'4:3')}${chip(k,'16:9')}${chip(k,'Travel','input')}${chip(k,'Add','assist')}</div>${sec(k,'Selection')}${row(k,'Flash',sw(k,true))}${row(k,'Grid lines',check(k,true))}${row(k,'Auto crop',check(k,false))}${row(k,'PDF',radio(k,true))}<div style="margin:10px 0 8px">${seg(k,['Columns','List','Stack'])}</div><div style="display:flex;gap:10px">${mini(k,true)}${mini(k,false)}</div>`}
function header(k,title,glass){const i=S.plat==='ios';if(i)return`<div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0 4px"><div style="padding:7px 12px;border-radius:17px;background:${glass?'rgba(255,255,255,.18)':k.fill};font-size:13px;color:${k.txt}">Cancel</div><div style="font-size:14px;font-weight:600">${title}</div><div style="padding:7px 14px;border-radius:17px;background:${k.acc};color:${k.onAcc};font-size:13px;font-weight:600">Done</div></div>`;return`<div style="display:flex;align-items:center;gap:10px;margin:2px 0 4px;height:40px">${ic('x',22)}<div style="flex:1;font-size:16px">${title}</div><div style="font-size:14px;font-weight:500;color:${k.acc}">Save</div></div>`}
function grab(k){return`<div style="width:36px;height:5px;border-radius:3px;background:${k.sep};margin:0 auto 8px"></div>`}
function scene(){const b=S.scene==='bright';const c=b?['#e6d8b0','#ffffff','#f2b84b','#7fb3d5']:['#2d2a26','#e9e6dc','#c9a46a','#5d7a5a'];return`<div style="position:absolute;inset:0;background:${c[0]}"><div style="position:absolute;left:30px;top:30px;width:150px;height:190px;background:${c[1]};transform:rotate(-6deg)"></div><div style="position:absolute;left:130px;top:190px;width:90px;height:90px;border-radius:45px;background:${c[2]}"></div><div style="position:absolute;left:-20px;top:330px;width:160px;height:120px;background:${c[3]}"></div><div style="position:absolute;left:120px;top:470px;width:120px;height:90px;background:${c[2]}"></div><div style="position:absolute;left:10px;top:560px;width:150px;height:140px;background:${c[1]};transform:rotate(8deg)"></div></div>`}
function panel(kind){const i=S.plat==='ios';const k=K(kind),title=kind==='page'?'Settings':'Camera settings';
if(kind==='page')return`<div style="width:218px;border-radius:22px;background:${i?(S.dark?'#000':'#f2f2f7'):(S.dark?'#131314':'#fdfcfb')};border:0.5px solid ${k.sep};padding:12px;box-sizing:border-box;color:${k.txt};font-family:${i?'-apple-system,system-ui,sans-serif':'Roboto,system-ui,sans-serif'}"><div style="font-size:22px;font-weight:700;margin:4px 0 0">${title}</div>${kit(k)}</div>`;
const ff=i?'-apple-system,system-ui,sans-serif':'Roboto,system-ui,sans-serif';
if(kind==='sheet')return`<div style="width:218px;border-radius:22px;background:${S.dark?'#0a0a0a':'#7c7c80'};overflow:hidden;padding-top:36px;font-family:${ff}"><div style="background:${i?(S.dark?'#1c1c1e':'#fff'):(S.dark?'#1e1f20':'#f3f3f6')};border-radius:${i?'26px 26px 0 0':'28px 28px 0 0'};padding:8px 12px 14px;color:${k.txt}">${grab(k)}${header(k,title)}${kit(k)}</div></div>`;
const a=S.scene==='bright'?.72:.55;
return`<div style="width:218px;border-radius:22px;overflow:hidden;position:relative;font-family:${ff}">${scene()}<div style="position:relative;margin-top:44px;background:rgba(28,29,32,${a});${BF}border-top:1px solid rgba(255,255,255,.28);border-radius:${i?'26px 26px 0 0':'28px 28px 0 0'};padding:8px 12px 14px;color:#fff">${grab(k)}${header(k,title,true)}${kit(k)}</div></div>`}
function render(){document.getElementById('out').innerHTML=[['page','Page'],['sheet','Sheet, opaque'],['glass','Sheet, transparent']].map(x=>`<div><div style="font-size:12px;color:var(--text-secondary);margin:0 0 6px">${x[1]}</div>${panel(x[0])}</div>`).join('');
const on=(id,v)=>document.getElementById(id).style.background=v?'var(--surface-1)':'transparent';on('bl',!S.dark);on('bd',S.dark);on('pi',S.plat==='ios');on('pa',S.plat==='android');on('sd',S.scene==='dark');on('sb',S.scene==='bright')}
[['bl',()=>S.dark=false],['bd',()=>S.dark=true],['pi',()=>S.plat='ios'],['pa',()=>S.plat='android'],['sd',()=>S.scene='dark'],['sb',()=>S.scene='bright']].forEach(x=>document.getElementById(x[0]).onclick=()=>{x[1]();render()});
render();
</script>
</body>
</html>
